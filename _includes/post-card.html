<li class="post-card">
  <a href="{{ include.post.url | relative_url }}">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%-d %B %Y' }}</time>
    <h2 class="post-title">{{ include.post.title }}</h2>
    <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncatewords: 32 }}</p>
    {% if include.post.tags.size > 0 %}<span class="post-tags">{{ include.post.tags | join: ' · ' }}</span>{% endif %}
  </a>
</li>
